[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mbn-aozora-feed"
version = "0.1.0"
description = "Japanese and Japan-focused 24-hour Bluesky feed generator"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "aiohttp>=3.11,<4",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
aozora-feed = "aozora_feed.main:main"
aozora-publish = "aozora_feed.publish:main"

[tool.hatch.build.targets.wheel]
packages = ["aozora_feed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
